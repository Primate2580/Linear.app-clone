<style>
  .pg-foot {
    background: #000;
    color: #fff;
    padding: 70px 70px 30px;
  }

  .pg-foot-top {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 40px;
    margin-bottom: 70px;
  }

  .pg-foot-heading {
    font-size: 17px;
    font-weight: 700;
    margin: 0 0 22px;
  }

  .pg-foot-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .pg-foot-list a {
    color: #e6e6e6;
    text-decoration: none;
    font-size: 15px;
  }

  .pg-foot-list a:hover {
    color: #fff;
    text-decoration: underline;
  }

  .pg-foot-socials {
    display: flex;
    gap: 20px;
    margin-top: 34px;
  }

  .pg-foot-socials a {
    color: #fff;
    font-size: 18px;
    text-decoration: none;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.2s ease, transform 0.2s ease;
  }

  .pg-foot-socials a:hover {
    opacity: 0.7;
    transform: translateY(-2px);
  }

  .pg-foot-bottom {
    border-top: 1px solid #262626;
    padding-top: 26px;
    text-align: center;
  }

  .pg-foot-bottom p {
    margin: 0;
    color: #aaa;
    font-size: 14px;
  }

  @media (max-width: 900px) {
    .pg-foot {
      padding: 50px 24px 24px;
    }

    .pg-foot-top {
      grid-template-columns: 1fr;
      gap: 44px;
    }
  }
</style>
