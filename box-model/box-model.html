<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Box Model Demo</title>
  <link rel="stylesheet" href="box-model.css">
</head>
<body>

  <div class="demo-wrapper">
    <h2>Understanding the CSS Box Model</h2>
    <p class="subtitle">Inspect how Padding, Border, and Margin affect dimensions.</p>

    <!-- Box 1: Regular Card -->
    <div class="box card-one">
      <h3>Card One</h3>
      <p>I have standard padding and margin.</p>
    </div>

    <!-- Box 2: Extra Padding -->
    <div class="box card-two">
      <h3>Card Two</h3>
      <p>I have double the padding inside me!</p>
    </div>

    <!-- Box 3: Highlighted Border -->
    <div class="box card-three">
      <h3>Card Three</h3>
      <p>I have a thick border and margin separation.</p>
    </div>
  </div>

</body>
</html>
