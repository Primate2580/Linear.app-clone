<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <!-- <link rel="stylesheet" href="position.css" /> -->

    <style>
      .sticky-header {
        position: sticky;
        top: 0;
        background-color: lightblue;
        padding: 10px;
        font-size: 20px;
        z-index: 9999;
        margin-bottom: 10px;
      }
      .card {
        width: 300px;
        height: 300px;
        background: bisque;
      }

      .box {
        padding: 5px;
        color: white;
      }

      .static-box {
        height: 40px;
        width: 290px;
        background: tomato;
        position: static;
        /* top: 20px; */
      }
      .relative-box {
        width: 280px;
        height: 40px;
        background-color: greenyellow;
        position: relative;
        z-index: 2;
      }

      .absolute-box {
        width: 280px;
        height: 40px;
        background-color: brown;
        position: absolute;
        left: 30px;
        top: 0;
        z-index: 1;
      }

      .extra-space {
        height: 1500px;
        background: repeating-linear-gradient(
          45deg,
          #fafafa,
          #fafafa 10px,
          #eee 10px,
          #eee 20px
        );
      }

      .fixed-box {
        background-color: green;
        height: 50px;
        width: 80px;
        border-radius: 30px;
        position: fixed;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 20px;
        font-weight: bold;
        position: fixed;
        bottom: 5%;
        right: 2%;
      }
    </style>
  </head>
  <body>
    <div class="fixed-box">Chat</div>

    <div class="wrapper">
      <div class="sticky-header">Sticky Header</div>

      <div class="card">
        <div class="box static-box">Static Box (static)</div>
        <div class="box relative-box">
          Relative Box (z-index: 2)
          <div class="box absolute-box">Absolute Box (z-index: 1)</div>
        </div>
      </div>

      <div class="extra-space">
        Scroll down to test scrolling and stacking...
      </div>
    </div>
  </body>
</html>
