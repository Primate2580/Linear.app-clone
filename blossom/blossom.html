<style>
  /* Section Wrapper */
  .vtour-section {
    padding: 80px 20px;
    background: #0f172a; /* Deep dark slate background */
    color: #ffffff;
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  }

  .vtour-container {
    max-width: 1200px;
    margin: 0 auto;
  }

  /* Section Header */
  .vtour-header {
    text-align: center;
    margin-bottom: 48px;
  }

  .vtour-badge {
    display: inline-block;
    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: 2px;
    color: #c5a059; /* Luxury Gold */
    text-transform: uppercase;
    background: rgba(197, 160, 89, 0.12);
    border: 1px solid rgba(197, 160, 89, 0.3);
    padding: 6px 18px;
    border-radius: 50px;
    margin-bottom: 12px;
  }

  .vtour-header h2 {
    font-size: 2.5rem;
    font-weight: 700;
    margin: 0;
    color: #ffffff;
  }

  /* Bento Gallery Grid */
  .vtour-grid {
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    gap: 20px;
  }

  /* Asymmetric Row Spans */
  .vtour-item {
    position: relative;
    border-radius: 16px;
    overflow: hidden;
    background: #1e293b;
    border: 1px solid rgba(255, 255, 255, 0.1);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    display: block;
    text-decoration: none;
  }

  /* Grid Column Layout Assignments */
  .vtour-item.span-6 { grid-column: span 6; height: 320px; }
  .vtour-item.span-4 { grid-column: span 4; height: 280px; }

  .vtour-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
  }

  /* Hover Overlay Effect */
  .vtour-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(15, 23, 42, 0.1) 0%, rgba(15, 23, 42, 0.75) 100%);
    opacity: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.4s ease;
  }

  .vtour-icon-btn {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: rgba(197, 160, 89, 0.9);
    color: #0b0f19;
    display: flex;
    align-items: center;
    justify-content: center;
    transform: translateY(15px);
    transition: transform 0.4s ease;
    box-shadow: 0 8px 20px rgba(0,0,0,0.4);
  }

  .vtour-icon-btn svg {
    width: 22px;
    height: 22px;
    fill: currentColor;
  }

  /* Hover States */
  .vtour-item:hover img {
    transform: scale(1.08);
  }

  .vtour-item:hover .vtour-overlay {
    opacity: 1;
  }

  .vtour-item:hover .vtour-icon-btn {
    transform: translateY(0);
  }

  /* Responsive Adjustments */
  @media (max-width: 992px) {
    .vtour-item.span-6,
    .vtour-item.span-4 {
      grid-column: span 6;
      height: 280px;
    }
  }

  @media (max-width: 600px) {
    .vtour-header h2 {
      font-size: 1.8rem;
    }
    .vtour-grid {
      grid-template-columns: 1fr;
      gap: 16px;
    }
    .vtour-item.span-6,
    .vtour-item.span-4 {
      grid-column: span 1;
      height: 240px;
    }
  }
</style>
