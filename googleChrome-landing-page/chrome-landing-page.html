<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document</title>
  <link rel="stylesheet" href="chrome-landing-page.css" />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>

<body>
  <h1 class="header-text">Google</h1>
  <div class="search-box">
    <div class="search-input-wrapper">
      <!-- Plus icon on the left -->
      <span class="material-symbols-outlined icon-add">add</span>

      <!-- Input Field -->
      <input type="text" placeholder="Ask Google" />

      <!-- Right Side Icons & Actions -->
      <div class="search-actions">
        <span class="material-symbols-outlined icon-btn">mic</span>
        <span class="material-symbols-outlined icon-btn">photo_camera</span>
        <button class="ai-mode-btn">
          <span class="material-symbols-outlined">auto_awesome</span>
          <span>AI Mode</span>
        </button>
      </div>
    </div>
    <ul class="suggestions">
      <li>
        <span class="material-symbols-outlined">history</span>
        <span>Materials symbol and Icons - Google search</span>
        <span class="material-symbols-outlined">close</span>
      </li>
      <li>
        <span class="material-symbols-outlined">history</span>
        <span>Materials symbol and Icons - Google search</span>
        <span class="material-symbols-outlined">close</span>
      </li>
      <li>
        <span class="material-symbols-outlined">history</span>
        <span>Materials symbol and Icons - Google search</span>
        <span class="material-symbols-outlined">close</span>
      </li>
    </ul>
  </div>
</body>

</html>
